# JAR ZIP for computers with Java installed: built and tested as a workflow artifact only.
# The draft release carries the Windows installer (.github/workflows/windows-release.yml).
name: Release ZIP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build the runnable JAR
        run: mvn -B -f server/pom.xml package
      - name: Build OfficeFlow-<version>.zip
        run: python3 packaging/jar/build_zip.py dist
      - uses: actions/upload-artifact@v5
        with:
          name: officeflow-release-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # The ZIP on Windows with an installed Java (the oldest supported version, 17).
  windows-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v5
        with:
          name: officeflow-release-zip
          path: dist
      - name: Run the ZIP with installed Java (first start, Ctrl+C, restart, replacement copy)
        shell: pwsh
        run: ./tests/windows_jar_zip_test.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
