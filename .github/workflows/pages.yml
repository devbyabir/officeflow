name: Publish live demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Java before publishing
        run: |
          mvn -B -f server/pom.xml package dependency:copy-dependencies
          python3 tests/test_server.py
      - name: Browser regression tests
        uses: ./.github/actions/ui-tests
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Re-runs retain earlier artifacts; select only this attempt.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
