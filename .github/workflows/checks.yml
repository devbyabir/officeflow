name: Application checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    # Pinned: Playwright's --with-deps installer does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Browser domain tests
        run: npm test
      - name: Build Java application
        run: mvn -B -f server/pom.xml package dependency:copy-dependencies
      # The release before usernames (pinned), so the HTTP tests can create a workspace with it
      # and upgrade a copy of that workspace with this build.
      - name: Build the previous release for the upgrade test
        shell: bash
        run: |
          previous=85dbe36a289cea15a5a8e2faf649ad5eb677f88f
          git fetch --no-tags --depth 1 origin "$previous"
          git worktree add --detach "$RUNNER_TEMP/previous-release" FETCH_HEAD
          mvn -B -q -f "$RUNNER_TEMP/previous-release/server/pom.xml" package -DskipTests
          echo "OFFICEFLOW_LEGACY_JAR=$RUNNER_TEMP/previous-release/server/target/officeflow-1.0.0.jar" >> "$GITHUB_ENV"
          echo "::notice title=Previous release for the upgrade test::$(git -C "$RUNNER_TEMP/previous-release" log -1 --format='%h %s')"
      - name: Java service tests
        shell: bash
        run: |
          javac --release 17 -encoding UTF-8 -Xlint:all,-serial -Werror -cp "server/target/classes:server/target/dependency/*" -d server/target/test-classes server/src/test/java/com/officeflow/ServiceTest.java
          java -cp "server/target/classes:server/target/test-classes:server/target/dependency/*" com.officeflow.ServiceTest | tee "$RUNNER_TEMP/service-tests.txt"
      - name: HTTP integration tests
        shell: bash
        run: python3 tests/test_server.py | tee "$RUNNER_TEMP/http-tests.txt"
      - name: Browser regression tests
        uses: ./.github/actions/ui-tests
      # Publish each suite's summary lines as annotations, visible on the run page.
      - name: Report what ran
        if: always()
        shell: bash
        run: |
          for suite in service-tests http-tests ui-tests; do
            file="$RUNNER_TEMP/$suite.txt"
            [ -f "$file" ] || { echo "::warning title=$suite::No output; the suite did not run."; continue; }
            lines=$(grep -E "^stage:|passed|refused|Skipped|skipped|JAR started|^Ran |^OK|FAILED|^(FAIL|ERROR): |JavaAccountBrowserTests|JavaFirstRunBrowserTests" "$file" || true)
            [ -n "$lines" ] || { echo "::warning title=$suite::No summary lines; the suite stopped early."; continue; }
            # One annotation per suite: GitHub shows at most 10 notices per step.
            echo "::notice title=$suite::$(printf '%s' "$lines" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
