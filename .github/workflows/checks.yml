name: Application checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Browser domain tests
        run: npm test
      - name: Build Java application
        run: mvn -B -f server/pom.xml package dependency:copy-dependencies
      - name: Test HTTP API and JDBC persistence
        run: |
          javac --release 17 -encoding UTF-8 -Xlint:all,-serial -Werror -cp "server/target/classes:server/target/dependency/*" -d server/target/test-classes server/src/test/java/com/officeflow/ServiceTest.java
          java -cp "server/target/classes:server/target/test-classes:server/target/dependency/*" com.officeflow.ServiceTest
          python3 tests/test_server.py
