# Set aside for a later release: the Windows package with a bundled Java runtime and the
# native OfficeFlow.exe launcher. It runs only when started by hand and never changes the
# GitHub release; the release uses .github/workflows/release-zip.yml.
name: Windows bundled package (set aside)
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the app; the bundled runtime comes from the pinned, verified JDK below.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Java application
        run: mvn -B -f server/pom.xml package
      - name: Download and verify the pinned Temurin JDK
        id: jdk
        shell: pwsh
        run: |
          $runner = Get-Content "$env:JAVA_HOME\release" | Where-Object { $_ -match '^(IMPLEMENTOR_VERSION|SOURCE)=' }
          Write-Output "::notice title=Runner JDK (builds the app only)::$($runner -join '; ')"
          $jdk = ./packaging/windows/fetch-jdk.ps1 -Destination $env:RUNNER_TEMP
          "path=$jdk" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      # The launcher's Visual C++ checks run here on real Windows against folders of copied
      # files (missing, outdated, current); the runner itself always has a current runtime.
      - name: Test and build OfficeFlow.exe (x64, no cgo)
        shell: pwsh
        working-directory: packaging/windows/launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          $tests = go test -v -count=1 ./... 2>&1
          $tests | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "Launcher tests failed" }
          $summary = ($tests | Select-String -Pattern '^--- (PASS|FAIL|SKIP)' | ForEach-Object { $_.Line.Trim() }) -join '%0A'
          Write-Output "::notice title=Launcher unit tests on real Windows with simulated runtime folders::$summary"
          go build -trimpath -ldflags "-s -w" -o "$env:RUNNER_TEMP\launcher\OfficeFlow.exe" .
      - name: Build Windows ZIP with bundled Java runtime
        shell: pwsh
        run: ./packaging/windows/build-zip.ps1 -Jdk "${{ steps.jdk.outputs.path }}" -Launcher "$env:RUNNER_TEMP\launcher\OfficeFlow.exe" -OutputDirectory dist
      # A truly missing or outdated Visual C++ runtime needs a clean Windows 10/11 PC:
      # docs/releases/v1.0.0-clean-windows-test.md.
      - name: Test the ZIP without system Java or Maven
        shell: pwsh
        run: ./tests/windows_release_smoke.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
      - name: Test the launcher in a real console (masking, browser, Ctrl+C, closing the window)
        shell: pwsh
        run: ./tests/windows_launcher_console.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v5
        with:
          name: officeflow-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  runtime-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the Java runtime source archive
        run: python3 packaging/runtime/build_source_archive.py dist
      - name: Upload source archive, checksum and provenance
        uses: actions/upload-artifact@v5
        with:
          name: officeflow-java-runtime-source
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-PROVENANCE.md
          if-no-files-found: error
