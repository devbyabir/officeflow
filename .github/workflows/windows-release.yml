name: Windows release package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the app; the bundled runtime comes from the pinned, verified JDK below.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Java application
        run: mvn -B -f server/pom.xml package
      - name: Download and verify the pinned Temurin JDK
        id: jdk
        shell: pwsh
        run: |
          $runner = Get-Content "$env:JAVA_HOME\release" | Where-Object { $_ -match '^(IMPLEMENTOR_VERSION|SOURCE)=' }
          Write-Output "::notice title=Runner JDK (builds the app only)::$($runner -join '; ')"
          $jdk = ./packaging/windows/fetch-jdk.ps1 -Destination $env:RUNNER_TEMP
          "path=$jdk" >> $env:GITHUB_OUTPUT
      - name: Build Windows ZIP with bundled Java runtime
        shell: pwsh
        run: ./packaging/windows/build-zip.ps1 -Jdk "${{ steps.jdk.outputs.path }}" -OutputDirectory dist
      # Uninstalls the runner's Visual C++ runtime to check the launcher message, then installs
      # Microsoft's official redistributable for the next test.
      - name: Missing Visual C++ runtime check, then install the official runtime
        shell: pwsh
        run: ./tests/windows_release_missing_runtime.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
      - name: Test the ZIP without system Java or Maven
        shell: pwsh
        run: ./tests/windows_release_smoke.ps1 -Zip (Get-ChildItem dist/*.zip).FullName
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v5
        with:
          name: officeflow-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  runtime-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the Java runtime source archive
        run: python3 packaging/runtime/build_source_archive.py dist
      - name: Upload source archive, checksum and provenance
        uses: actions/upload-artifact@v5
        with:
          name: officeflow-java-runtime-source
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-PROVENANCE.md
          if-no-files-found: error

  # Attaches both archives to a draft release. It never publishes, and it refuses to change a
  # release that is already published.
  draft-release:
    needs: [package, runtime-source]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/windows-release') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums and write release notes
        shell: bash
        run: |
          version=$(python3 -c "import re; print(re.search(r'<artifactId>officeflow</artifactId>\s*<version>([^<]+)</version>', open('server/pom.xml').read()).group(1))")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cd release
          sha256sum -c *.zip.sha256
          sha256sum *.zip > SHA256SUMS.txt
          {
            cat "../docs/releases/v$version.md"
            printf '\n## Checksums (SHA-256)\n\n```text\n'
            cat SHA256SUMS.txt
            printf '```\n\n'
            sed 's/^# /## /' OfficeFlow-*-PROVENANCE.md
          } > ../release-notes.md
          echo "::notice title=Release checksums::$(tr '\n' ' ' < SHA256SUMS.txt)"
      - name: Create or update the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/release/update_draft_release.py "v$VERSION" release-notes.md release/*
