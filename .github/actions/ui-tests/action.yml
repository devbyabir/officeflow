name: Browser regression tests
description: Exercise theme, navigation, mobile layout and dialogs in Chromium
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install -r tests/requirements-ui.txt
    - shell: bash
      run: python -m playwright install --with-deps chromium
    - shell: bash
      run: python tests/test_ui.py
      env:
        OFFICEFLOW_UI_JAVA: "1"
